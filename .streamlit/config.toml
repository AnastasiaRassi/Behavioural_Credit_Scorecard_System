# Interface theme, for Streamlit's own widgets. Risk colour is still defined
# once in frontend/theme.py.
#
# Light, with the sign-in photograph's palette: the accent is its glass blue.
# Red, amber and green mean risk band and audit outcome on this dashboard, so
# spending them on buttons and active tabs would make the interface argue with
# the numbers.

[theme]
base = "light"
primaryColor = "#4A6B85"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF3F7"
textColor = "#2B2724"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
